<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>QA jump — Chemistry Lab</title>
</head>
<body>
  <p>Setting save and redirecting…</p>
  <script>
    const params = new URLSearchParams(location.search);
    const level = Math.max(0, Math.min(9, Number(params.get("level") || 1)));
    const sub = Math.max(0, Math.min(9, Number(params.get("sub") || 0)));
    const key = "gq-chemistry-lab-save-v1";
    const completed = Array.from({ length: 10 }, () => Array(10).fill(false));
    // Unlock prior steps in this mission so the rail can jump.
    for (let i = 0; i < sub; i++) completed[level][i] = true;
    // Also mark Tiny Bits done when jumping into Element Hunt / Bond Buddies for hub chrome.
    if (level >= 1) completed[0] = Array(10).fill(true);
    if (level >= 2) completed[1] = Array(10).fill(true);
    const introSeen = Array(10).fill(false);
    introSeen[level] = true;
    const payload = {
      level,
      sub,
      completed,
      rewards: Array.from({ length: 10 }, () => ({ earned: false, stars: 0 })),
      introSeen,
      inHub: false,
    };
    localStorage.setItem(key, JSON.stringify(payload));
    location.replace("/games/chemistry-lab/index.html?v=elemhunt7&play=1");
  </script>
</body>
</html>
