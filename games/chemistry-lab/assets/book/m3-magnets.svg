<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t d">
  <title id="t">Bar magnets attracting</title>
  <desc id="d">Two bar magnets, north facing south, with a pull between them. An analogy for attraction  not a chemical bond.</desc>
  <rect width="640" height="360" fill="#f4f1ea"/>
  <text x="320" y="42" text-anchor="middle" font-family="Sora, system-ui, sans-serif" font-size="18" font-weight="700" fill="#1c1917">Attraction is a pull. A bond is an atom-to-atom link.</text>
  <g transform="translate(70,120)">
    <rect width="200" height="88" rx="8" fill="#c43c2c"/>
    <rect x="200" width="200" height="88" rx="8" fill="#1e3a5f"/>
    <text x="100" y="54" text-anchor="middle" font-family="Sora, sans-serif" font-size="36" font-weight="800" fill="#fff">N</text>
    <text x="300" y="54" text-anchor="middle" font-family="Sora, sans-serif" font-size="36" font-weight="800" fill="#fff">S</text>
  </g>
  <g transform="translate(70,228)">
    <rect width="200" height="88" rx="8" fill="#1e3a5f"/>
    <rect x="200" width="200" height="88" rx="8" fill="#c43c2c"/>
    <text x="100" y="54" text-anchor="middle" font-family="Sora, sans-serif" font-size="36" font-weight="800" fill="#fff">S</text>
    <text x="300" y="54" text-anchor="middle" font-family="Sora, sans-serif" font-size="36" font-weight="800" fill="#fff">N</text>
  </g>
  <text x="560" y="178" text-anchor="middle" font-family="Sora, sans-serif" font-size="22" fill="#35a373">pull</text>
  <path d="M490 164 L540 164 L540 272 L490 272" fill="none" stroke="#35a373" stroke-width="3" stroke-dasharray="6 5"/>
</svg>
