<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title data-i18n="shell.appTitle">Force Fighter 3D Playground - GyanQuest</title>
  <style id="gq-hub-first-paint">
    /* Hide play UI before any stylesheet loads (.hidden alone does nothing without CSS) */
    #play-chrome, .play-chrome { display: none !important; }
    #app.app--playing #play-chrome,
    #app.app--playing .play-chrome { display: flex !important; }
  </style>

  <link rel="icon" href="/assets/gyanquest-logo.png" type="image/png" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="/engine/css/mission-hub.css" />
  <link rel="stylesheet" href="/engine/css/concept-viz.css" />
  <link rel="stylesheet" href="/engine/css/voice.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&family=Sora:wght@400;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app" class="app--mission-hub">
    <header class="top-bar">
      <div class="brand">
        <span class="brand-mark" data-i18n="shell.brandMark">Force Fighter</span>
        <h1 data-i18n="shell.brandH1">Learn Push, Pull &amp; More!</h1>
        <span class="subject-tag" data-i18n="shell.subjectTag">Fun physics for all</span>
      </div>
      <div class="top-actions">
        <a href="/" class="btn secondary gq-hub-link" data-i18n="shell.hubBack" title="Back to GyanQuest">← GyanQuest</a>
        <span id="reward-slot" class="reward-slot" aria-live="polite"></span>
        <label class="lang-picker">
          <span data-i18n="shell.langLabel">Language</span>
          <select id="lang-select" aria-label="Choose language">
            <option value="en">English</option>
            <option value="bn">বাংলা</option>
          </select>
        </label>
        <button type="button" id="btn-playground" class="btn secondary btn-playground" data-i18n="shell.playground" data-i18n-attr="title" title="Free-play Force Lab">
          🧪 Playground
        </button>
        <label class="level-picker">
          <span data-i18n="shell.mission">Mission</span>
          <select id="level-select" data-i18n="shell.levelSelectAria" data-i18n-attr="aria-label" aria-label="Choose mission"></select>
        </label>
        <button type="button" id="btn-missions" class="btn secondary hidden" title="All missions">☰ Missions</button>
        <span id="checkpoint-badge" class="checkpoint-badge hidden" data-i18n="shell.bonusQuizTitle" data-i18n-attr="title" title="Bonus quiz"></span>
      </div>
    </header>

    <div id="mission-hub-root" class="mission-hub-root" aria-live="polite">
      <div class="gq-hub">
        <header class="gq-hub__head">
          <p class="gq-hub__eyebrow">GyanQuest</p>
          <h2 class="gq-hub__title">Choose a mission</h2>
          <p class="gq-hub__sub">Loading missions…</p>
        </header>
      </div>
    </div>

    <div id="play-chrome" class="play-chrome">
    <div class="progress-row">
      <div id="level-title" class="level-title"></div>
      <div class="sub-dots" id="sub-dots" data-i18n="shell.subDotsAria" data-i18n-attr="aria-label" aria-label="Steps in this level"></div>
    </div>
    <div class="progress-bar-wrap" aria-hidden="false">
      <div class="progress-bar" role="progressbar" aria-labelledby="progress-label">
        <div id="progress-fill" class="progress-bar__fill"></div>
      </div>
      <span id="progress-label" class="progress-bar__label" data-i18n="shell.stepsLeftOne">0 steps left in this level</span>
    </div>
    <div id="lab-depth" class="lab-depth" aria-live="polite"></div>

    <main class="stage">
      <div id="viewport" class="viewport">
        <canvas id="c3d" data-i18n="shell.canvasAria" data-i18n-attr="aria-label" aria-label="3D play area"></canvas>
        <div id="viewport-hud" class="viewport-hud" aria-live="polite"></div>
      </div>

      <div id="play-dock" class="play-dock" data-i18n="shell.coachDockAria" data-i18n-attr="aria-label" aria-label="Coach and activities">
        <div class="play-dock__head">
          <div class="play-dock__coach">
            <span class="coach-inline-avatar" aria-hidden="true">🦸</span>
            <div class="coach-inline-meta">
              <strong class="coach-inline-name" data-i18n="shell.coachName">Coach Force</strong>
              <p id="coach-text" class="coach-text"></p>
              <p id="voice-caption" class="voice-caption" hidden></p>
            </div>
          </div>
          <div class="play-dock__head-actions">
            <button type="button" id="btn-next-dock" class="btn primary hidden" data-i18n="shell.nextDock" data-i18n-attr="title" title="Go to next step">Next ▶</button>
            <button type="button" id="btn-toggle-panel" class="btn secondary play-dock__toggle" data-i18n="shell.hidePanel" data-i18n-attr="title,aria-label" title="Hide / show panel" aria-label="Hide panel">−</button>
            <button type="button" id="btn-try-again" class="btn secondary" data-i18n="shell.tryAgain" data-i18n-attr="title" title="Try this step again">↻ Try again</button>
          </div>
        </div>
        <div id="coach-actions" class="coach-actions"></div>
        <div id="overlay" class="play-dock__tasks"></div>
      </div>
    </main>

    <footer class="bottom-bar">
      <div id="scores" class="scores"></div>
      <div class="footer-actions">
        <button type="button" id="btn-reset-all" class="btn secondary" data-i18n="shell.resetAll" data-i18n-attr="title" title="Clear all saved progress and start over">↻ Reset all</button>
        <button type="button" id="btn-hint" class="btn secondary" data-i18n="shell.hint">💡 Hint</button>
        <button type="button" id="btn-next" class="btn primary hidden" data-i18n="shell.nextStep">Next step ▶</button>
      </div>
    </footer>
    </div>
  </div>

  <div id="modal-root" class="modal-root" aria-hidden="true"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <script defer src="vendor/three.min.js"></script>
  <script defer src="vendor/OBJLoader.js"></script>
  <script defer src="vendor/OrbitControls.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
